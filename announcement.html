<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Abyssinia Craft SMP - Announcements</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📢 Abyssinia Craft SMP</h1>
<p>Official Announcement Board</p>

<hr>

<div id="feed"></div>

<script>
    // 📦 Starting announcements (server intro)
    let announcements = [
        {
            text: "🌍 Welcome to Abyssinia Craft SMP!",
            user: "SYSTEM"
        },
        {
            text: "🚀 The server is officially starting today. Get ready for an amazing survival experience!",
            user: "SYSTEM"
        },
        {
            text: "📜 Stay updated here for all news, events, and server updates.",
            user: "SYSTEM"
        },
        {
            text: "👑 Owned by: Abyssinia Team (yp & dagmawi)",
            user: "SYSTEM"
        },
        {
            text: "# 🌐 Official Announcement — The Abyssinia Craft SMP Website is Here!

Hello everyone,

We are excited to announce a major milestone for our community: **the official Abyssinia Craft SMP website is now under development and will soon be available to all players!**

For a long time, our Discord server has been the main hub for communication, updates, and community interaction. As our server continues to grow, we believe it is time to create a dedicated platform that brings everything together in one place. The new website is being designed to make it easier for both new and existing members to access important information, stay updated, and become more involved in the Abyssinia Craft SMP community.

## What Will the Website Include?

The website will serve as the central hub for everything related to Abyssinia Craft SMP. Planned features include:

🏠 **Home Page**

* A professional introduction to the server
* Information about the community and its goals
* Server highlights and featured content

📜 **Rules Section**

* A complete list of server and Discord rules
* Easy-to-read guidelines for all members
* Updated policies and announcements

📢 **Announcements & News**

* Important server updates
* Event announcements
* Maintenance notices
* Development progress reports

👥 **Staff Information**

* Information about the server team
* Staff roles and responsibilities
* Ways to contact the administration when necessary

🎉 **Events and Community Activities**

* Upcoming server events
* Competitions and challenges
* Community projects and collaborations

📊 **Server Information**

* Server status updates
* Technical information
* Future development plans

## Why Are We Creating a Website?

Our goal is to provide a better experience for every member of the community. The website will help us:

* Keep information organized and accessible.
* Provide a professional identity for Abyssinia Craft SMP.
* Make it easier for new players to join and understand the community.
* Create a central location for announcements, events, and updates.
* Support future expansions and new features as the community grows.

## A New Chapter for Abyssinia Craft SMP

The creation of this website represents more than just a new platform—it represents the growth and future of our community. What started as a simple Minecraft server has become a place where players can build, explore, collaborate, and create lasting memories together. The website is another step toward building a stronger and more connected community.

We are working hard to ensure that the website is functional, informative, and visually appealing. While development is still ongoing, we wanted to share this exciting news with everyone and give you a glimpse of what is coming.

## Stay Tuned

More updates will be announced as development progresses. We appreciate everyone's support, feedback, and participation in making Abyssinia Craft SMP a welcoming and enjoyable community.

Thank you for being part of this journey with us. We cannot wait to share the finished website with all of you.

**Abyssinia Craft SMP Staff Team**
*"Building a community, one block at a time."* 🏰✨
",
}  ]
    

    function render() {
        let feed = document.getElementById("feed");
        feed.innerHTML = "";

        announcements.forEach(a => {
            let div = document.createElement("div");

            div.innerHTML = `
                <h3>${a.text}</h3>
                <small>Posted by: ${a.user}</small>
                <hr>
            `;

            feed.appendChild(div);
        });
    }

    render();
</script>

</body>
</html>
